pythonJob:
  enabled: false
  name: "python-job"
  scriptContent: ""
  requirementsContent: ""
  env: {}   # environment variables for the job, stored in a Secret (set by infra/eks.tf)
  hostNetwork: false   # true: use the node's network, e.g. to reach the node role's credentials (IMDS hop limit 1)
  backoffLimit: 4
  ttlSecondsAfterFinished: 100
  restartPolicy: Never
  image:
    repository: jupyter/all-spark-notebook
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 1.0
      memory: 2Gi
    requests:
      cpu: 0.5
      memory: 1Gi
